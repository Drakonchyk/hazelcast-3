spring:
  application:
    name: messages-service

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        instance-id: ${spring.application.name}-${server.port}
    discovery:
      reactive:
        enabled: false

  config:
    import:
      optional:consul:

server:
  port: 8091         # overridden on the command line for replicas

# Kafka consumer / producer group ids etc. can also be externalised
# via Consul KV the same way we did kafka.bootstrap-servers.
