spring:
  application:
    name: facade-service

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        instance-id: ${spring.application.name}-${server.port}
    discovery:
      reactive:
        enabled: false      # ☑ disables reactive Consul client

  config:
    import:
      optional:consul:

server:
  port: 7070
